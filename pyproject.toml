[project]
name = "llm-wiki"
version = "0.1.0"
description = "Textual TUI for a Deep Agent — a Claude Code-style AI interface."
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = [
    "textual>=0.83",
    "deepagents",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=3.0",
    "langchain-openai>=1.0,<2.0",
    "langsmith>=0.3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.5",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
llm-wiki = "llm_wiki.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
